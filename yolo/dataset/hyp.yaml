# Optimization
box: 10.0  # higher -> more weight on localization (is naturally higher than cls)
cls: 1.0  # higher -> more weight on classification (is naturally lower than box)
dfl: 1.0  # higher -> more weight on precise localization
# obj: 1.0  # higher -> more weight on not missing objects (false positives vs. false negatives)

# Augmentations
hsv_h: 0.015  # max hue shift
hsv_s: 0.4  # max saturation shift
hsv_v: 0.6  # max value (brightness) shift
degrees: 25.0  # max rotation in degrees
translate: 0.2  # max translation as a fraction of image size
scale: 0.5  # max zoom in/out as a fraction of image size
shear: 2.0  # max shear in degrees
perspective: 0.0005  # max perspective distortion
flipud: 0.5  # probability of flipping images vertically
fliplr: 0.5  # probability of flipping images horizontally
bgr: 0.1  # probability of converting images to BGR format
mosaic: 0.1  # probability of combining images into one
mixup: 0.01  # probability of mixing two images together
cutmix: 0.01  # probability of cutting and mixing two images
